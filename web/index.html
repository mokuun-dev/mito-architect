<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mito-Architect: molecule-resolved mitochondrial DNA variant, phasing, and rearrangement analysis."
    />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Mito-Architect · mtDNA analysis console</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('mito-theme');
        const useLight = savedTheme !== 'dark';
        document.documentElement.classList.toggle('light', useLight);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mito-Architect: molecule-resolved mitochondrial DNA variant, phasing, and rearrangement analysis."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Mito-Architect · mtDNA workbench</title>
    <script>
      // Light is the default; `?theme=dark|light` sets and remembers a theme.
      try {
        const requested = new URLSearchParams(location.search).get('theme');
        if (requested === 'dark' || requested === 'light') localStorage.setItem('mito-theme', requested);
        const useLight = localStorage.getItem('mito-theme') !== 'dark';
        document.documentElement.classList.toggle('light', useLight);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
